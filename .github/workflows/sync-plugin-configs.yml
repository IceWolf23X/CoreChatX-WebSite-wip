name: Sync plugin configuration defaults

on:
  workflow_dispatch:
  repository_dispatch:
    types: [corex-plugin-defaults-updated]

permissions:
  contents: write

concurrency:
  group: sync-plugin-configs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Optional PAT/App token lets this commit trigger a separate deploy workflow.
          # Without it, GitHub's normal repository GITHUB_TOKEN is used.
          token: ${{ secrets.COREX_WEBSITE_WRITE_TOKEN || github.token }}

      - name: Check private-source credential
        env:
          READ_TOKEN: ${{ secrets.COREX_PLUGIN_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error::Set COREX_PLUGIN_READ_TOKEN with read-only Contents access to CoreChatX-plugin. Initial snapshots are already bundled."
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check out private plugin source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: IceWolf23X/CoreChatX-plugin
          ref: codex/fix-source-audit
          token: ${{ secrets.COREX_PLUGIN_READ_TOKEN }}
          path: .sync/plugin
          persist-credentials: false

      - name: Synchronize allowed defaults
        run: node tools/sync-plugin-configs.mjs .sync/plugin .

      - name: Rebuild offline configuration bundle
        run: node tools/build-config-bundle.mjs .

      - name: Validate website theme data
        run: node tests/validate-theme.mjs

      - name: Commit synchronized changes
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- synced-configs assets/js/generated/config-files.js; then
            echo "No published configuration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synced-configs assets/js/generated/config-files.js
          git commit -m "docs: sync CoreChatX configuration defaults"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
